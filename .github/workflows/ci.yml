name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs when a developer rapidly pushes to the same PR branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the shared reusable workflow so deploy.yml can invoke the exact
  # same gate as a pre-deploy precheck. Single source of truth for CI checks.
  checks:
    uses: ./.github/workflows/checks.yml
